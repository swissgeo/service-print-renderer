services:
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: dynamodb-local
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    networks:
      - network_local

  elasticmq:
    image: softwaremill/elasticmq
    container_name: elasticmq
    ports:
      - "${SQS_PORT:-9324}:9324"
    networks:
      - network_local

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "${S3_PORT:-9000}:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    networks:
      - network_local

  init-dynamo:
    image: amazon/aws-cli
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
          echo "Waiting for DynamoDB..."; sleep 2
        done
        aws dynamodb create-table \
          --table-name ${DYNAMODB_TABLE_NAME} \
          --attribute-definitions AttributeName=job_id,AttributeType=S \
          --key-schema AttributeName=job_id,KeyType=HASH \
          --provisioned-throughput ReadCapacityUnits=2,WriteCapacityUnits=1 \
          --endpoint-url http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    networks:
      - network_local

  init-sqs:
    image: amazon/aws-cli
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws sqs list-queues --endpoint-url http://elasticmq:9324 >/dev/null 2>&1; do
          echo "Waiting for ElasticMQ..."; sleep 2
        done
        aws sqs create-queue --queue-name ${SQS_DL_QUEUE_NAME} --endpoint-url http://elasticmq:9324
        DLQ_URL=$$(aws sqs get-queue-url --queue-name ${SQS_DL_QUEUE_NAME} --endpoint-url http://elasticmq:9324 --query 'QueueUrl' --output text)
        DLQ_ARN=$$(aws sqs get-queue-attributes --queue-url $$DLQ_URL --endpoint-url http://elasticmq:9324 --attribute-names QueueArn --query 'Attributes.QueueArn' --output text)
        aws sqs create-queue \
          --queue-name ${SQS_QUEUE_NAME} \
          --endpoint-url http://elasticmq:9324 \
          --attributes "RedrivePolicy={\"deadLetterTargetArn\":\"$$DLQ_ARN\",\"maxReceiveCount\":\"${SQS_MAX_RECEIVE_COUNT}\"},VisibilityTimeout=${SQS_VISIBILITY_TIMEOUT}"
    depends_on:
      - elasticmq
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - SQS_MAX_RECEIVE_COUNT=${SQS_MAX_RECEIVE_COUNT}
      - SQS_VISIBILITY_TIMEOUT=${SQS_VISIBILITY_TIMEOUT}
    networks:
      - network_local

  init-s3:
    image: amazon/aws-cli
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws s3api list-buckets --endpoint-url http://minio:9000 >/dev/null 2>&1; do
          echo "Waiting for MinIO..."; sleep 2
        done
        aws s3api create-bucket \
          --bucket ${S3_BUCKET_NAME} \
          --endpoint-url http://minio:9000 \
          --create-bucket-configuration LocationConstraint=${AWS_REGION}
    depends_on:
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_REGION=${AWS_REGION}
    networks:
      - network_local

  renderer-info:
    profiles: [renderer-info]
    build:
      context: .
      target: production
    command: ["-m", "app.worker", "--renderer-info"]
    env_file: ${ENV_FILE:-.env}
    environment:
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:/run/user/1000/${WAYLAND_DISPLAY:-wayland-0}
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/dri:/dev/dri

networks:
  network_local:
    driver: bridge
    name: shared_network_local
