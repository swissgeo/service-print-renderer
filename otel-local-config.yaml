receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug/traces:
    verbosity: detailed

  debug/logs:
    verbosity: detailed

  debug/metrics:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/metrics]
