receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug/traces:
    verbosity: detailed

  debug/logs:
    verbosity: detailed

  debug/metrics:
    verbosity: detailed

  # Push metrics into Prometheus via its OTLP receiver (started with
  # --web.enable-otlp-receiver in docker-compose-otel.yml). View them at
  # http://localhost:9090.
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/metrics, otlphttp/prometheus]
