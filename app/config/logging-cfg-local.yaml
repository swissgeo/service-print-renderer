version: 1
disable_existing_loggers: False # this allow to get logger at module level

root:
  handlers:
    - console
    - file-standard
    - file-json
  level: DEBUG
  propagate: True

loggers:
  botocore:
    level: INFO
  boto3:
    level: INFO

filters:
  isotime:
    (): logging_utilities.filters.TimeAttribute
    isotime: False
    utc_isotime: True

formatters:
  standard:
    format: "[%(asctime)s] %(levelname)-8s - %(name)-26s : %(message)s"
  verbose:
    (): logging_utilities.formatters.extra_formatter.ExtraFormatter
    format: "[%(asctime)s] %(levelname)-8s - %(name)-26s : %(message)s"
  json:
    (): logging_utilities.formatters.json_formatter.JsonFormatter
    add_always_extra: False
    filter_attributes:
      - utc_isotime
    remove_empty: True
    ignore_missing: True
    fmt:
      time: utc_isotime
      level: levelname
      logger: name
      module: module
      function: funcName
      pidTid: "%(process)x/%(thread)x"
      excInfo: exc_info
      message: message
      otelSpanID: otelSpanID
      otelTraceID: otelTraceID
      otelTraceSampled: otelTraceSampled
  ecs:
    (): ecs_logging.StdlibFormatter

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout
    filters:
      - isotime
  file-standard:
    level: DEBUG
    class: logging.FileHandler
    formatter: verbose
    filename: ${LOGS_DIR}/worker-standard-logs.txt
    mode: w
    filters:
      - isotime
  file-json:
    level: DEBUG
    class: logging.FileHandler
    formatter: json
    filename: ${LOGS_DIR}/worker-json-logs.json
    mode: w
    filters:
      - isotime
  console-ecs:
    class: logging.StreamHandler
    formatter: ecs
    stream: ext://sys.stdout
